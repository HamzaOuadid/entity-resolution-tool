[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution-tool"
version = "0.1.0"
description = "Record-linkage / entity-resolution pipeline: normalize, block, score, and cluster messy multi-source entity records, with an explicit review queue and measured precision/recall against a hand-labelled sample."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hamza Ouadid" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "jellyfish>=1.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
entity-resolution = "entity_resolution.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
