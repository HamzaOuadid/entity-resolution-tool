name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: pytest tests/ -v

      - name: Generate synthetic messy dataset and run the full pipeline (smoke test)
        run: |
          entity-resolution generate-data --out /tmp/ci-data --n-entities 200 --seed 1
          entity-resolution run-all --data-dir /tmp/ci-data --db /tmp/ci-er.db --report-out /tmp/ci-report.json

      - name: Sanity-check the metrics report
        run: |
          python -c "
          import json
          m = json.load(open('/tmp/ci-report.json'))
          assert m['full_dataset_precision'] > 0.7, m
          assert m['full_dataset_recall'] > 0.5, m
          assert m['blocking_recall'] > 0.7, m
          print('metrics look sane:', m)
          "
